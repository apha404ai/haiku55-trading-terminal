<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha404 Haiku Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;
  --bg:#07080b;--bg2:#0b0d12;--panel:#0d1016;--panel2:#121620;--line:#1b2130;--line2:#262e40;
  --text:#e8edf5;--muted:#7d8799;--dim:#3c4558;--up:#22e39a;--down:#ff4d6a;--acc:#b6ff3b;--acc2:#3d8bff;--acc3:#e052c0;--warn:#ffb020;
  --ui:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--disp:var(--ui);
  --r:12px;--gap:10px;--pad:14px}
*{box-sizing:border-box}
html{font-size:clamp(9px,.68vw,16px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 1rem/1.35 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}.dim{color:var(--dim)}.acc{color:var(--acc)}.acc2{color:var(--acc2)}.warn{color:var(--warn)}
.tn{font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;height:100%}
.pn canvas{position:absolute;inset:0}
.pn .cw{position:absolute;inset:.6rem var(--pad) var(--pad)}
.pn.flush .cw{inset:0}

.app{height:100%;display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap);position:relative;
  background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--acc) 7%,transparent),transparent 60%),radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--acc2) 6%,transparent),transparent 50%),var(--bg)}
.grid{flex:1;min-height:0;display:grid;gap:var(--gap)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:1.6rem;height:2.6rem;padding:0 .4rem;white-space:nowrap;overflow:hidden;font-size:.92rem;letter-spacing:.06em;color:var(--muted)}
.topbar .brand{display:flex;align-items:center;gap:.6rem;color:var(--text);font:700 1.05rem var(--disp);letter-spacing:.14em}
.topbar .brand i{width:.55rem;height:.55rem;border-radius:50%;background:var(--up);box-shadow:0 0 .6rem var(--up);animation:pulse 1.4s infinite}
.topbar .brand em{font-style:normal;color:var(--acc)}
.topbar .tk b{color:var(--text);font-weight:600;margin-left:.45rem}
.topbar .sp{flex:1}
.topbar .tcouncil{display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.topbar .tcouncil span{display:flex;align-items:center;gap:.35rem}
.topbar .tcouncil img{width:1.6rem;height:1.6rem;object-fit:contain}
.topbar .clk{color:var(--text)}
@keyframes pulse{50%{opacity:.35}}

/* ---------- panel ---------- */
.pn{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r)}
.pn>.ph{display:flex;align-items:center;gap:.8rem;padding:var(--pad) var(--pad) .2rem;font-size:.92rem;letter-spacing:.16em;color:var(--muted);white-space:nowrap;z-index:3}
.pn>.ph b{color:var(--text);font-weight:600}
.pn>.ph .r{margin-left:auto;display:flex;gap:.5rem;align-items:center;letter-spacing:.08em}
.pn>.bd{flex:1;min-height:0;position:relative;padding:.6rem var(--pad) var(--pad)}
.pn.flush>.bd{padding:0}
.pn.flush>.ph{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 85%,transparent),transparent)}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;letter-spacing:.12em;padding:.22rem .6rem;border:1px solid var(--line2);border-radius:.4rem;color:var(--muted);background:color-mix(in srgb,var(--bg) 60%,transparent)}
.pill.live{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.pill.live::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor;box-shadow:0 0 .5rem currentColor;animation:pulse 1.3s infinite}
.pill.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.pill.down{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.pill.solid{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lbl{font-size:.8rem;letter-spacing:.16em;color:var(--muted)}
.flash-up{animation:fu 1s}.flash-dn{animation:fd 1s}
@keyframes fu{from{background:color-mix(in srgb,var(--up) 22%,transparent)}}
@keyframes fd{from{background:color-mix(in srgb,var(--down) 22%,transparent)}}

/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column;height:100%;gap:.4rem}
.hero .big{font:700 4.2rem/1 var(--ui);letter-spacing:-.02em;display:flex;align-items:flex-start;gap:.3rem}
.hero .big small{font-size:.45em;color:var(--muted);margin-top:.3em;font-weight:500}
.hero .sub{font-size:1.05rem}
.hero .spark{flex:1;min-height:3rem;position:relative}
.hero .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tile{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:.6rem .8rem}
.tile .lbl{display:block;margin-bottom:.3rem}
.tile b{font:700 1.6rem/1 var(--ui)}

/* ---------- council ---------- */
.council{display:flex;flex-direction:column;gap:.55rem;height:100%}
.mdl{display:grid;grid-template-columns:4.2rem 1fr 4.6rem;gap:.8rem;align-items:center}
.mdl .av{width:4.2rem;height:4.2rem;border-radius:.8rem;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;position:relative;overflow:hidden}
.mdl .av img{width:78%;height:78%;object-fit:contain}
.mdl .av::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--mc,transparent);opacity:0;transition:opacity .3s}
.mdl.on .av::after{opacity:1}
.mdl .nm{font:700 1.15rem var(--ui);letter-spacing:.02em;color:var(--mc)}
.mdl .nm span{font:400 .75rem var(--mono);letter-spacing:.14em;color:var(--muted);margin-left:.6rem}
.mdl .th{margin-top:.3rem;font-size:.9rem;color:var(--muted);border-left:2px solid var(--line2);padding:.25rem .6rem;background:color-mix(in srgb,var(--bg) 50%,transparent);border-radius:0 .3rem .3rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl .th i{display:inline-block;width:.45rem;height:.9rem;background:var(--muted);vertical-align:-.1rem;animation:pulse .7s infinite;margin-left:1px}
.mdl .vt{display:flex;flex-direction:column;align-items:stretch;gap:.35rem;font-size:.78rem;text-align:center}
.mdl .vt b{border:1px solid var(--line2);border-radius:.35rem;padding:.25rem 0;letter-spacing:.14em;color:var(--muted);font-weight:500}
.mdl .vt b.L{color:var(--up);border-color:color-mix(in srgb,var(--up) 50%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.mdl .vt b.S{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.mdl .cf{display:flex;align-items:center;gap:.4rem;color:var(--muted)}
.mdl .cf u{flex:1;height:3px;background:var(--line2);border-radius:2px;position:relative;text-decoration:none}
.mdl .cf u i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--mc);transition:width .4s}
.cons{margin-top:auto;display:grid;grid-template-columns:auto 1fr auto 1.3fr;gap:.8rem;align-items:center;font-size:.85rem;letter-spacing:.12em;color:var(--muted)}
.cons .bars{display:flex;gap:.3rem}.cons .bars i{flex:1;height:.4rem;border-radius:.2rem;background:var(--line2);transition:background .3s}
.cons .dec{border:1px solid var(--line2);border-radius:.5rem;padding:.55rem .8rem;text-align:center;color:var(--muted);letter-spacing:.14em}
.cons .dec.go{color:var(--bg);background:var(--acc);border-color:var(--acc);font-weight:700}

/* ---------- tables / lists ---------- */
.tbl{display:flex;flex-direction:column;gap:.35rem;font-size:.95rem}
.tbl .row{display:grid;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:.45rem;border:1px solid transparent;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.tbl .row.hl{border-color:color-mix(in srgb,var(--up) 55%,transparent);background:color-mix(in srgb,var(--up) 9%,transparent)}
.tbl .row.hd{background:none;color:var(--dim);font-size:.75rem;letter-spacing:.14em;padding:0 .6rem}
.tag{font-size:.75rem;letter-spacing:.1em;text-align:center;padding:.2rem 0;border-radius:.3rem;border:1px solid}
.tag.L,.tag.TP{color:var(--up);border-color:color-mix(in srgb,var(--up) 50%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.tag.S,.tag.SL{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.tag.TIME{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:.32rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.kv span{color:var(--muted);letter-spacing:.1em;font-size:.82rem}
.mgrid{display:grid;gap:.6rem;height:100%}
.mgrid .m{border:1px solid var(--line);border-radius:calc(var(--r)*.6);padding:.6rem .7rem;display:flex;flex-direction:column;justify-content:space-between;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.mgrid .m b{font:700 1.5rem/1.1 var(--ui)}
.mgrid .m small{font-size:.75rem;color:var(--dim)}

/* ---------- log bar ---------- */
.logbar{height:2.2rem;display:flex;align-items:center;gap:1rem;font-size:.88rem;color:var(--muted);letter-spacing:.06em;overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);padding:0 .4rem}
.logbar .lb{color:var(--dim);letter-spacing:.16em}
.logbar .stream{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 92%,transparent)}
.logbar .stream div{display:flex;gap:2.4rem;position:absolute;left:0;white-space:nowrap}
.logbar .st{color:var(--up)}

/* ---------- controls + overlays ---------- */
.ctl{position:fixed;right:1.2rem;bottom:3rem;z-index:50;display:flex;gap:.25rem;padding:.3rem;border-radius:.6rem;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line2);transition:opacity .4s;opacity:0}
.ctl button{font:500 .8rem var(--mono);letter-spacing:.08em;background:none;color:var(--muted);border:1px solid transparent;border-radius:.4rem;padding:.35rem .6rem;cursor:pointer}
.ctl button:hover{color:var(--text)}.ctl button.on{color:var(--bg);background:var(--acc)}
.clean .ctl{display:none}
.wm{position:absolute;left:50%;bottom:1.4rem;transform:translateX(-50%);font:700 2.4rem var(--ui);color:#fff;opacity:.9;letter-spacing:.01em;pointer-events:none;z-index:4;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.nowm .wm{display:none}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center}
.toast div{animation:tst 2.2s forwards;font:800 4.4rem/1 var(--ui);letter-spacing:-.02em}
.toast span{display:block;font:500 1rem var(--mono);letter-spacing:.3em;margin-top:.5rem}
@keyframes tst{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}12%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-1.5rem)}}

/* ---------- panel styles ---------- */
.st-glass .pn{background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(10px)}
.st-neon .pn{border-color:color-mix(in srgb,var(--acc) 35%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 10%,transparent),0 0 2rem color-mix(in srgb,var(--acc) 8%,transparent),inset 0 0 2rem color-mix(in srgb,var(--acc) 4%,transparent)}
.st-brutal .pn{border-radius:0;border:2px solid var(--text);background:var(--panel)}
.st-brutal .pn>.ph{background:var(--text);color:var(--bg);padding:.3rem .7rem;font-weight:700}
.st-brutal .pn>.ph b{color:var(--bg)}
.st-brutal .pn.flush>.ph{position:relative;background:var(--text)}
.st-brutal .pill{border-radius:0}
.st-brutal .pn>.ph .pill{background:var(--bg);border-color:var(--bg)}
.st-brutal .tile,.st-brutal .mgrid .m,.st-brutal .mdl .av,.st-brutal .tbl .row,.st-brutal .cons .dec{border-radius:0}
.st-hud .pn{border-radius:2px;border-color:color-mix(in srgb,var(--acc) 22%,transparent);background:color-mix(in srgb,var(--panel) 80%,transparent)}
.st-hud .pn::before,.st-hud .pn::after{content:"";position:absolute;width:1rem;height:1rem;border:2px solid var(--acc);z-index:5;pointer-events:none}
.st-hud .pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.st-hud .pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.st-term .app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.st-term .app::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:61;box-shadow:inset 0 0 12rem rgba(0,0,0,.85)}
.st-term .pn{border-radius:3px;text-shadow:0 0 .35rem color-mix(in srgb,var(--up) 60%,transparent)}
.st-term .hero .big,.st-term .tile b,.st-term .mgrid .m b{font-family:var(--mono)}
.st-paper .pn{box-shadow:0 1px 0 var(--line2),0 .8rem 2rem rgba(0,0,0,.06)}
.st-paper .app{background:var(--bg)}
.st-paper{color-scheme:light}
.st-paper .wm{color:var(--text);text-shadow:none;opacity:.75}
.st-paper .pn.flush>.ph{background:linear-gradient(180deg,var(--panel),transparent)}

/* ---------- desk windows (kit-w3) ---------- */
.brandp{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important}
.brandp>.ph{display:none}
.brandb{display:flex;align-items:center;gap:1.2rem;height:100%}
.brandb .bl{width:4.6rem;height:4.6rem;border-radius:1rem;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 2.4rem color-mix(in srgb,var(--acc) 60%,transparent);flex-shrink:0}
.brandb .bl img{width:72%;height:72%;object-fit:contain;filter:brightness(0) invert(1)}
.brandb .bt{display:flex;flex-direction:column;line-height:.95}
.brandb .bt b{font:800 2.6rem var(--ui);letter-spacing:.01em;color:var(--text)}
.brandb .bt b.g{background:linear-gradient(90deg,var(--acc),var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brandb .bt span{margin-top:.6rem;font-size:.78rem;letter-spacing:.22em;color:var(--muted)}
.ops{display:flex;flex-direction:column;gap:.75rem}
.op{display:grid;grid-template-columns:1fr auto 5rem;grid-template-rows:auto .3rem;gap:.25rem .8rem;align-items:center}
.op .nm{font-weight:700;letter-spacing:.08em}.op .v{color:var(--acc)}
.op .st{grid-row:1/3;grid-column:3;text-align:center;font-size:.78rem;letter-spacing:.1em;padding:.4rem 0;border-radius:.35rem;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--muted)}
.op .st.hot{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 1rem color-mix(in srgb,var(--acc) 60%,transparent)}
.op .st.cool{background:color-mix(in srgb,var(--acc2) 70%,transparent);border-color:var(--acc2);color:#fff}
.op u{grid-column:1/3;height:.3rem;background:var(--line2);border-radius:.2rem;text-decoration:none;position:relative}
.op u i{position:absolute;left:0;top:0;bottom:0;border-radius:.2rem;background:linear-gradient(90deg,var(--acc3),var(--acc));transition:width .4s}
.code{font-size:.86rem;line-height:1.65;white-space:pre;overflow:hidden}
.code div{display:flex;gap:1rem;padding:0 .3rem;border-left:2px solid transparent}
.code div.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-left-color:var(--acc)}
.code i{font-style:normal;color:var(--dim);width:1.4rem;flex-shrink:0}
.code .k{color:var(--acc)}.code .s{color:var(--acc2)}.code .n{color:var(--warn)}.code .cm{color:var(--muted)}
.code .cur{display:inline-block;width:.5rem;height:1em;background:var(--acc);vertical-align:-.15em;margin-left:2px;animation:pulse .8s infinite}
.clog{flex:1;min-height:0;overflow:hidden;font-size:.78rem}
.clog div{display:grid;grid-template-columns:5.6rem 5rem 1fr;gap:.5rem;white-space:nowrap}
.clog i{font-style:normal;color:var(--dim)}.clog b{color:var(--acc);font-weight:500}.clog span{overflow:hidden;text-overflow:ellipsis}
.pos.tbl .row{padding:.4rem .5rem}
.net{display:flex;align-items:center;gap:1rem;margin-top:.6rem}.net b{font-size:1.2rem}
.dstat{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.5rem}.dstat .lbl{display:block}.dstat b{font-size:1rem}
.stripp{background:color-mix(in srgb,var(--bg) 82%,transparent)!important}
.stripp>.ph{display:none}
.stripp>.bd{display:flex;align-items:center;gap:1.4rem;padding:.6rem 1.2rem!important}
.hand{display:flex;gap:1.6rem;flex:1}
.hand div{display:grid;grid-template-columns:auto auto;gap:.2rem .6rem;font-size:.8rem;letter-spacing:.08em;min-width:6rem}
.hand b{color:var(--acc)}.hand u{grid-column:1/3;height:.35rem;background:var(--line2);border-radius:.2rem;position:relative;text-decoration:none}
.hand u i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:.2rem;transition:width .4s}
.sep{width:1px;align-self:stretch;background:var(--line2)}
.tick{display:flex;gap:2rem}.tick div{display:grid;grid-template-columns:auto 5rem;grid-template-rows:auto auto;gap:0 .8rem;align-items:center}
.tick span{font-weight:700}.tick b{grid-column:1}.tick em{font-style:normal;font-size:.78rem}.tick canvas{grid-column:2;grid-row:1/3;position:static;height:2.2rem}
.pn.ghost{background:transparent!important;border:0!important;box-shadow:none!important}

:root{ --bg:#07040a;--panel:#100a14;--panel2:#140c19;--line:#2a1a2e;--line2:#3a2440;--text:#fdf2f8;--muted:#a88aa0;--dim:#5e4658;--up:#3ef2b0;--down:#ff4f7b;--acc:#ff3d8b;--acc2:#8f7dff;--acc3:#ff8ac0;--warn:#ffc857;--ui:'Space Grotesk',sans-serif;--r:12px }
.wm{bottom:auto;top:1.4rem;font-size:2rem}.brandb .bt b{font-size:2.3rem}.st-glass .pn:not(.ghost){background:color-mix(in srgb,var(--panel) 66%,transparent)}
</style></head>

<script>
/* ALPHA404 market + council simulator.
   BTC is the detailed instrument (book, tape, candles). Other assets run lighter walks.
   Four models vote, think out loud and message each other. Equity history is built
   from simulated daily trades so every stat on screen comes from the same ledger. */
(function(){
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const nf=(v,d)=>Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const F={
  usd:(v,d=2)=>(v<0?'-':'')+'$'+nf(v,d),
  sUsd:(v,d=2)=>(v>=0?'+':'-')+'$'+nf(v,d),
  pct:(v,d=2)=>(v>=0?'+':'')+v.toFixed(d)+'%',
  px:(p,d)=>nf(p,d==null?(p>=1000?1:p>=10?2:4):d),
  num:(v,d=0)=>nf(v,d),
  big:v=>{const a=Math.abs(v);return (v<0?'-':'')+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0));},
  hms:d=>d.toTimeString().slice(0,8),
  sgn:(v,d=2)=>(v>=0?'+':'')+v.toFixed(d),
};

const MODELS={
  claude:{id:'claude',name:'CLAUDE OPUS 5.5',short:'CLAUDE',role:'FUNDING · MACRO',color:'#e07a54',style:'funding'},
  jev:{id:'jev',name:'JEV',short:'JEV',role:'LIQUIDITY · STRUCTURE',color:'#e052c0',style:'liquidity'},
  dots:{id:'dots',name:'OPENAI DOTS',short:'DOTS',role:'ORDER BOOK · ARB',color:'#3d8bff',style:'arb'},
  haiku:{id:'haiku',name:'CLAUDE HAIKU 5.5',short:'HAIKU',role:'HEAD · ORCHESTRATOR',color:'#ff4fa3',style:'orchestrator'},
  orb:{id:'orb',name:'ORB',short:'ORB',role:'MOMENTUM · RISK',color:'#e8eef5',style:'momentum'},
};
const ASSETS=[
  {s:'BTC',px:84144,v:.00006},{s:'ETH',px:3412.8,v:.00009},{s:'SOL',px:142.6,v:.00012},{s:'HYPE',px:41.82,v:.00016},
  {s:'DOGE',px:.1624,v:.00014},{s:'XRP',px:2.184,v:.00011},{s:'SUI',px:3.412,v:.00015},{s:'LINK',px:15.84,v:.00012},
];
const VENUES=['BINANCE','BYBIT','OKX','HL','COINBASE'];

function Sim(cfg){
  const o=Object.assign({start:10000,lev:20,riskPct:.8,tickMs:200,candleTicks:5,hist:160,levels:18,
    models:['claude','jev','dots'],assets:6,pace:3,edge:1.4,vote:.35,days:90,winP:.58,payoff:.85,tradesDay:[1,3]},cfg||{});
  const models=o.models.map(id=>Object.assign({},MODELS[id]||MODELS.orb));
  const ev={}, S={speed:1,paused:false};
  const api={o,S,F,MODELS,VENUES,models,rnd,randn,pick,clamp,on:(k,f)=>((ev[k]=ev[k]||[]).push(f),api)};
  const emit=(k,...a)=>{ if(!S.warm) (ev[k]||[]).forEach(f=>f(...a)); };
  const B=()=>S.as[0];

  /* ---------- helpers ---------- */
  const tickOf=a=>a.base>=10000?.5:a.base>=1000?.05:a.base>=10?.01:a.base>=1?.0005:.00001;
  const round=(a,p)=>{ const t=a.tick; return Math.round(p/t)*t; };
  const mk=(p,t)=>({o:p,h:p,l:p,c:p,v:0,bv:0,t});

  function regime(){
    const r=Math.random();
    S.regime=r<.42?'TREND':r<.78?'RANGE':'BREAKOUT';
    S.drift=S.regime==='TREND'?rnd(-1,1):S.regime==='BREAKOUT'?(Math.random()<.5?-1:1)*rnd(1.6,2.6):0;
    S.volK=S.regime==='RANGE'?.75:S.regime==='BREAKOUT'?1.6:1;
    S.anchor=B().px; emit('regime',S.regime);
  }

  /* ---------- per-tick market ---------- */
  function walkAll(){
    if(Math.random()<.006) regime();
    const g=randn();                                  // shared factor -> correlation
    S.as.forEach((a,i)=>{
      const sd=a.px*a.v*S.volK;
      let b=(i===0?S.drift*sd*.2:S.drift*sd*.12)+(a.d||0)*sd*.1;
      if(i===0&&S.regime==='RANGE') b+=(S.anchor-a.px)*.03;
      const pos=S.pos.find(p=>p.a===a.s); if(pos&&Math.random()<.17) b+=pos.side*sd*.55*o.edge;
      const z=g*.68+randn()*.73;
      a.prev=a.px; a.px=Math.max(a.tick,round(a,a.px+b+z*sd));
      if(Math.random()<.004) a.d=rnd(-1,1);
      a.hi24=Math.max(a.hi24,a.px); a.lo24=Math.min(a.lo24,a.px);
    });
  }
  function prints(d){
    const a=B(), n=1+(Math.random()*4|0), sd=a.px*a.v;
    for(let i=0;i<n;i++){
      const side=Math.random()<(.5+Math.tanh(d/sd/1.2)*.35)?1:-1;
      const sz=+Math.exp(randn()*1.1-1.9).toFixed(3);
      const p={side,sz,px:a.px,usd:sz*a.px,t:S.clock,venue:pick(VENUES)};
      S.cvd+=side*sz; side>0?S.buyV+=sz:S.sellV+=sz;
      S.cur.v+=sz; if(side>0) S.cur.bv+=sz;
      S.vwapPV+=a.px*sz; S.vwapV+=sz;
      S.prints.unshift(p); if(S.prints.length>160) S.prints.pop();
      emit('print',p);
    }
    S.buyV*=.996; S.sellV*=.996;
  }
  function book(){
    const a=B(), st=a.step, bb=Math.floor(a.px/st)*st;
    if(Math.random()<.06){ const k=(Math.random()<.5?-1:1)*st*(2+(Math.random()*(o.levels-3)|0)); S.walls.set(bb+k,rnd(6,22)); }
    for(const [p,s] of S.walls){ const n=s*.988-(Math.abs(p-a.px)<st*1.5?2.5:0); if(n<.6) S.walls.delete(p); else S.walls.set(p,n); }
    const lv=(p,i)=>({p,s:+(rnd(.3,2.4)*(1+i*.1)+(S.walls.get(p)||0)).toFixed(3)});
    S.book={bids:[],asks:[]};
    for(let i=0;i<o.levels;i++){ S.book.bids.push(lv(bb-i*st,i)); S.book.asks.push(lv(bb+(i+1)*st,i)); }
    const sb=S.book.bids.reduce((s,l)=>s+l.s,0), sa=S.book.asks.reduce((s,l)=>s+l.s,0);
    S.imb=sb/(sb+sa);
    let w=null; S.book.bids.concat(S.book.asks).forEach(l=>{ if(!w||l.s>w.s) w=l; }); S.wall=w;
  }
  function macro(){
    VENUES.forEach(v=>{ S.funding[v]=clamp(S.funding[v]+randn()*.0006+(.008-S.funding[v])*.002+S.bias*.0002,-.06,.08); S.lat[v]=clamp(S.lat[v]+randn()*.6+(S.latBase[v]-S.lat[v])*.08,1,60); });
    S.oi=Math.max(5e9,S.oi*(1+randn()*.0004+S.bias*.0001)); S.vol24+=Math.abs(randn())*2e6;
    S.basis=clamp(S.basis+randn()*.002,-.2,.4);
    S.spread=clamp(S.spread+randn()*.004+(.02-S.spread)*.02,0,.12);
    if(Math.random()<(S.regime==='BREAKOUT'?.05:.012)){
      const side=Math.random()<.5?1:-1, usd=Math.exp(randn()*1.2+11.5);
      const l={side,usd,a:pick(S.as.slice(0,o.assets)).s,venue:pick(VENUES),t:S.clock};
      S.liqs.unshift(l); if(S.liqs.length>40) S.liqs.pop(); side>0?S.liqL+=usd:S.liqS+=usd; emit('liq',l);
    }
  }
  const ema=(arr,n)=>{ const k=2/(n+1); let e=arr[0]; for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k); return e; };

  /* ---------- models ---------- */
  function models_(){
    const a=B(); S.mom.push(a.px); if(S.mom.length>25) S.mom.shift();
    const sd=a.px*a.v, m=(a.px-S.mom[0])/25/sd;
    const fnd=VENUES.reduce((s,v)=>s+S.funding[v],0)/VENUES.length;
    S.ag.forEach((g,i)=>{
      const st=models[i].style;
      let tgt=st==='funding'?Math.tanh(-fnd*40+S.drift*.6+m*.5)
        :st==='liquidity'?Math.tanh((S.imb-.5)*9+m*.6)
        :st==='arb'?Math.tanh(S.cvdSlope*2+m*.5)
        :Math.tanh(m*1.4+S.drift*.8);
      g.c=clamp(g.c+(tgt-g.c)*.1+randn()*.06,-1,1);
      g.vote=g.c>o.vote?1:g.c<-o.vote?-1:0; g.conf=Math.round(50+Math.abs(g.c)*46);
    });
    const mean=S.ag.reduce((s,g)=>s+g.c,0)/S.ag.length, sg=Math.sign(mean)||1;
    S.cons=S.ag.filter(g=>g.vote===sg).length; if(!S.warm){ S.wait=(S.wait||0)+(!S.pos.find(p=>p.a==='BTC')&&S.cool<=0&&S.cons<S.need?1:0); } S.bias=mean; S.need=S.ag.length>=4?Math.ceil(S.ag.length*.7):2;
    S.edge=Math.abs(mean)*S.cons/S.ag.length*6;
  }
  const W=()=>S.wall?F.px(S.wall.p,0):'-';
  const THINK={
    funding:g=>{ const f=VENUES.reduce((s,v)=>s+S.funding[v],0)/VENUES.length*100;
      return pick(g.vote? [`Funding ${f.toFixed(3)}%. ${f<0?'Shorts paying':'Longs crowded'}. Lean ${g.vote>0?'long':'short'}.`,`Basis ${S.basis.toFixed(2)}%. Macro tape ${g.vote>0?'supportive':'heavy'}.`]
        :[`Funding ${f.toFixed(3)}% neutral. No edge here.`,`OI ${F.big(S.oi)} flat. Waiting on funding flip.`]); },
    liquidity:g=>{ const r=S.range;
      return pick(g.vote? [`Liq wall ${W()} · ${S.wall?S.wall.s.toFixed(1):0} BTC. ${g.vote>0?'Bid absorbing':'Offer stacking'}.`,`Sweep below ${F.px(r.lo,0)} done. Structure ${g.vote>0?'higher low':'lower high'}.`]
        :[`Range ${F.px(r.lo,0)}-${F.px(r.hi,0)}. No break yet.`,`Book ${(S.imb*100).toFixed(0)}% bid. Walls thin.`]); },

  sim.on('close',t=>{ pulse=1; cards.push({t:0,h:.38,an:2.2,title:t.pnl>0?'SHIPPED':'STOPPED',st:F.sUsd(t.pnl,0),col:t.pnl>0?'up':'down',sub:`${t.a}-PERP · ${t.r>=0?'+':''}${t.r.toFixed(2)}R`}); tag('a human ships','text',3200); });
